name: Build & Deploy Web (jouable sur mobile)

# Construit l'export HTML5/WebAssembly du jeu avec Godot 4 puis le publie sur
# GitHub Pages. Une fois terminé, ouvre l'URL Pages depuis ton téléphone.

on:
  push:
    branches:
      - claude/dust-dollars-godot-EyJtt
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement Pages à la fois.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    name: Export Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot ${{ env.GODOT_VERSION }} + export templates
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          wget -qO godot.zip "${BASE}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -qO templates.tpz "${BASE}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          mkdir -p "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz
          mv templates/* "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          godot --version

      - name: Import des ressources (passe éditeur headless)
        run: |
          # Génère le cache d'import (.godot/). Tolérant : on continue même si
          # Godot renvoie un code non nul ou s'arrête via le timeout.
          timeout 120 godot --headless --editor --path . --quit-after 400 2>&1 | tail -n 40 || true

      - name: Export du build Web
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html 2>&1 | tail -n 80
          # Vérifie que l'export a bien produit les fichiers attendus.
          test -f build/web/index.html
          test -f build/web/index.wasm
          touch build/web/.nojekyll
          echo "--- Contenu de build/web ---"
          ls -lh build/web

      - name: Upload de l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Déploiement GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Activer/configurer Pages
        # enablement: true active GitHub Pages (source = Actions) sans réglage
        # manuel dans les Settings, si le plan du dépôt le permet.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Déployer sur Pages
        id: deployment
        uses: actions/deploy-pages@v4
