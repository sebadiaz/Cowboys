name: Build & Deploy Web (jouable sur mobile)

# Construit l'export HTML5/WebAssembly du jeu avec Godot 4, puis publie le
# résultat sur la branche "gh-pages". GitHub Pages sert ensuite cette branche.
# Méthode volontairement sans environnement Pages ni action tierce : on pousse
# le build avec le token intégré, ce qui fonctionne depuis n'importe quelle
# branche (pas de restriction de "deployment branch").

on:
  push:
    branches:
      - claude/dust-dollars-godot-EyJtt
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "web-deploy"
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.3"

jobs:
  build-deploy:
    name: Export Web + publication gh-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot ${{ env.GODOT_VERSION }} + export templates
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          wget -qO godot.zip "${BASE}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -qO templates.tpz "${BASE}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          mkdir -p "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz
          mv templates/* "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          godot --version

      - name: Import des ressources (passe éditeur headless)
        run: |
          timeout 120 godot --headless --editor --path . --quit-after 400 2>&1 | tail -n 40 || true

      - name: Export du build Web
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html 2>&1 | tail -n 80
          test -f build/web/index.html
          test -f build/web/index.wasm
          echo "--- Contenu de build/web ---"
          ls -lh build/web

      - name: Publier sur la branche gh-pages
        run: |
          set -euo pipefail
          cd build/web
          touch .nojekyll            # sert les fichiers tels quels (pas de Jekyll)
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy web build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Build publié sur la branche gh-pages."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
